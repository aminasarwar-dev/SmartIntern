<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartIntern — Create Account</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet"
    >

    <!-- Existing CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">

    <!-- Signup CSS -->
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="signup-page">

    <!-- Soft Background -->
    <div class="signup-bg bg-one"></div>
    <div class="signup-bg bg-two"></div>

    <!-- Subtle 3D Background -->
    <canvas id="threeCanvas"></canvas>


    <!-- ================= SIGNUP ================= -->

    <main class="signup-wrapper">

        <section class="signup-card">

            <!-- Heading -->

            <div class="signup-heading">

                <div class="brand-mini">
                    Smart<span>Intern</span>
                </div>

                <h1>
                    Create your
                    <em>account.</em>
                </h1>

                <p>
                    Start your journey with SmartIntern.
                </p>

            </div>


            <!-- ================= ROLE ================= -->

            <div class="role-switch">

                <button
                    type="button"
                    class="role-option active"
                    data-role="student"
                >
                    Student
                </button>

                <button
                    type="button"
                    class="role-option"
                    data-role="company"
                >
                    Company
                </button>

            </div>


            <!-- ================= FORM ================= -->

            <form id="signupForm" novalidate>

                <input
                    type="hidden"
                    id="accountRole"
                    value="student"
                >


                <!-- Full Name -->

                <div class="input-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                    <span
                        class="error"
                        id="nameError"
                    ></span>

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                    <span
                        class="error"
                        id="emailError"
                    ></span>

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                        >
                            Show
                        </button>

                    </div>

                    <span
                        class="error"
                        id="passwordError"
                    ></span>

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>

                    </div>

                    <span
                        class="error"
                        id="confirmError"
                    ></span>

                </div>


                <!-- Button -->

                <button
                    type="submit"
                    class="signup-button"
                >

                    <span>
                        Create Account
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>


                <!-- Login -->

                <p class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Log in
                    </a>

                </p>

            </form>

        </section>

    </main>


    <!-- ================= SUCCESS ================= -->

    <div
        class="success-overlay"
        id="successOverlay"
    >

        <div class="success-box">

            <div class="success-mark">
                ✓
            </div>

            <h2>
                Account Created
            </h2>

            <p>
                Your SmartIntern account is ready.
            </p>

            <button
                id="continueBtn"
                class="signup-button"
            >

                <span>
                    Continue
                </span>

                <span class="button-arrow">
                    →
                </span>

            </button>

        </div>

    </div>


    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Signup JS -->
    <script src="../js/signup.js"></script>

</body>
</html>
